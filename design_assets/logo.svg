<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow for Key Elevation on White Background -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>

    <!-- Clip Mask: Confines the Red Overlap strictly to the Ring Wall -->
    <clipPath id="rimBandClip">
      <path d="M 260,150 A 150,150 0 1,1 259.9,150 Z M 260,225 A 75,75 0 1,0 260.1,225 Z" fill-rule="evenodd" />
    </clipPath>

    <!-- Clip for Green Bit Teeth Cutout -->
    <clipPath id="greenBitClip">
      <path d="M 620,250 H 840 V 450 H 785 A 45,45 0 0,0 695,450 H 620 Z" />
    </clipPath>

    <!-- Clip for Yellow Stem Area -->
    <clipPath id="yellowStemClip">
      <rect x="400" y="250" width="220" height="100" />
    </clipPath>
  </defs>

  <!-- ================= 1. CIRCULAR WHITE BACKGROUND WITH BORDER ================= -->
  <!-- Outer Dark/Slate Contour Ring -->
  <circle cx="500" cy="500" r="470" fill="#FFFFFF" stroke="#0F172A" stroke-width="12" />

  <!-- Subtle Inner Platinum Accent Ring -->
  <circle cx="500" cy="500" r="454" fill="none" stroke="#E2E8F0" stroke-width="4" />

  <!-- ================= 2. MASTER KEY (CENTERED INSIDE CIRCLE) ================= -->
  <!-- Key is scaled and perfectly centered around (500, 500) -->
  <g transform="translate(65, 245) scale(0.85)" filter="url(#softShadow)">

    <!-- A. KEY STEM (YELLOW PART) + ENCRYPTION -->
    <g clip-path="url(#yellowStemClip)">
      <!-- Yellow Shaft Base -->
      <rect x="400" y="250" width="220" height="100" fill="#FBBC05" />

      <!-- Encryption Circuit Matrix Pattern -->
      <g stroke="#D97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65">
        <path d="M 410,268 H 442 L 456,282 H 564 L 578,268 H 610" />
        <circle cx="442" cy="282" r="3" fill="#D97706" />
        <circle cx="564" cy="282" r="3" fill="#D97706" />
        <path d="M 410,332 H 442 L 456,318 H 564 L 578,332 H 610" />
        <circle cx="442" cy="318" r="3" fill="#D97706" />
        <circle cx="564" cy="318" r="3" fill="#D97706" />
      </g>

      <!-- Binary Stream Accents -->
      <g fill="#D97706" font-family="monospace, monospace" font-size="11" font-weight="bold" opacity="0.45" letter-spacing="3">
        <text x="432" y="278">101001</text>
        <text x="526" y="278">110010</text>
        <text x="432" y="328">011010</text>
        <text x="526" y="328">001101</text>
      </g>

      <!-- Central Hexagonal Cipher Core Shield -->
      <g transform="translate(510, 300)">
        <polygon points="0,-27 24,-14 24,14 0,27 -24,14 -24,-14" fill="#FFFFFF" stroke="#E65100" stroke-width="3" stroke-linejoin="round" />
        <path d="M -7,-2 V -11 C -7,-15 -4,-18 0,-18 C 4,-18 7,-15 7,-11 V -2" fill="none" stroke="#E65100" stroke-width="3" stroke-linecap="round" />
        <rect x="-11" y="-3" width="22" height="18" rx="4" ry="4" fill="#E65100" />
        <circle cx="0" cy="4" r="2.5" fill="#FFFFFF" />
        <path d="M -1,5.5 L -1.5,10 H 1.5 L 1,5.5 Z" fill="#FFFFFF" />
      </g>
    </g>

    <!-- B. GREEN BIT (TEETH) + ENCRYPTION LOCK -->
    <g clip-path="url(#greenBitClip)">
      <rect x="620" y="250" width="220" height="100" fill="#34A853" />
      <rect x="620" y="350" width="220" height="100" fill="#1E8E3E" />

      <!-- High-Tech Circuit Traces -->
      <g stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" fill="none">
        <path d="M 640,280 H 670 L 685,295 V 325" />
        <circle cx="640" cy="280" r="3" fill="#A7F3D0" />
        <path d="M 820,280 H 790 L 775,295" />
        <circle cx="820" cy="280" r="3" fill="#A7F3D0" />
        <path d="M 640,400 H 665" />
        <circle cx="665" cy="400" r="3" fill="#A7F3D0" />
        <path d="M 820,400 H 795" />
        <circle cx="795" cy="400" r="3" fill="#A7F3D0" />
      </g>

      <!-- Padlock Symbol -->
      <g id="encryptionSymbol" transform="translate(730, 340)">
        <path d="M -22,-14 V -32 C -22,-46 -12,-56 0,-56 C 12,-56 22,-46 22,-32 V -14" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
        <rect x="-36" y="-16" width="72" height="60" rx="14" ry="14" fill="#FFFFFF" />
        <circle cx="0" cy="8" r="7" fill="#1E8E3E" />
        <path d="M -3.5,12 L -5.5,27 H 5.5 L 3.5,12 Z" fill="#1E8E3E" />
        <circle cx="0" cy="8" r="2.5" fill="#FFFFFF" />
      </g>
    </g>

    <!-- C. COMPLETE BLUE DONUT RIM -->
    <path d="M 260,150 A 150,150 0 1,0 260.1,150 Z M 260,225 A 75,75 0 1,1 259.9,225 Z" fill="#4285F4" fill-rule="evenodd" />

    <!-- D. RED OVERLAP CONFINED TO RIM BAND -->
    <g clip-path="url(#rimBandClip)">
      <rect x="260" y="250" width="160" height="100" fill="#EA4335" />
    </g>

    <!-- E. FEATURE ICONS ON THE BLUE RIM -->
    <!-- PIN (Top at 90°) -->
    <g id="pinFeature" transform="translate(260, 187)">
      <rect x="-34" y="-20" width="68" height="40" rx="10" ry="10" fill="#FFFFFF" />
      <g fill="#4285F4">
        <circle cx="-18" cy="-9" r="3" /><circle cx="0" cy="-9" r="3" /><circle cx="18" cy="-9" r="3" />
        <circle cx="-18" cy="0" r="3" /><circle cx="0" cy="0" r="3" /><circle cx="18" cy="0" r="3" />
        <circle cx="-18" cy="9" r="3" /><circle cx="0" cy="9" r="3" /><circle cx="18" cy="9" r="3" />
      </g>
      <path d="M -18,9 L 0,0 L 18,9" fill="none" stroke="#EA4335" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- PASSWORD (Left at 180°) -->
    <g id="passwordFeature" transform="translate(148, 300)">
      <rect x="-34" y="-20" width="68" height="40" rx="20" ry="20" fill="#FFFFFF" />
      <g fill="#4285F4">
        <circle cx="-18" cy="0" r="4" /><circle cx="-6" cy="0" r="4" /><circle cx="6" cy="0" r="4" /><circle cx="18" cy="0" r="4" />
      </g>
      <circle cx="18" cy="0" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- CREDENTIALS (Bottom at 270°) -->
    <g id="credentialsFeature" transform="translate(260, 413)">
      <rect x="-34" y="-21" width="68" height="42" rx="7" ry="7" fill="#FFFFFF" />
      <g fill="#4285F4">
        <circle cx="-16" cy="-5" r="5.5" />
        <path d="M -24,10 C -24,4.5 -20,3.5 -16,3.5 C -12,3.5 -8,4.5 -8,10 Z" />
      </g>
      <rect x="0" y="-10" width="22" height="3.5" rx="1.75" fill="#4285F4" />
      <rect x="0" y="-3" width="15" height="2.5" rx="1.25" fill="#4285F4" opacity="0.6" />
      <rect x="0" y="3" width="20" height="2.5" rx="1.25" fill="#4285F4" opacity="0.6" />
      <rect x="12" y="8" width="10" height="6.5" rx="1.5" fill="#FBBC05" />
    </g>

    <!-- Rim Specular Reflection Curve -->
    <path d="M 260,154 A 146,146 0 0,0 120,256" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.35" />
  </g>
</svg>